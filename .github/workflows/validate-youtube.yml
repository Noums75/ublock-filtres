name: Vérifier filtres YouTube
on:
  push:
    paths:
      - 'youtube/**'
      - 'twitch/twitch-filters.txt'
      - 'filtres-complets.txt'
      - 'scripts/check-youtube.mjs'
      - '.github/workflows/validate-youtube.yml'
  pull_request:
    paths:
      - 'youtube/**'
      - 'twitch/twitch-filters.txt'
      - 'filtres-complets.txt'
      - 'scripts/check-youtube.mjs'
      - '.github/workflows/validate-youtube.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les filtres YouTube
        run: node scripts/check-youtube.mjs
