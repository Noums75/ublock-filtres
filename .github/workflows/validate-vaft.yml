name: Vérifier VAFT
on:
  push:
    paths:
      - 'twitch/**'
      - 'scripts/check-vaft.mjs'
      - '.github/workflows/validate-vaft.yml'
  pull_request:
    paths:
      - 'twitch/**'
      - 'scripts/check-vaft.mjs'
      - '.github/workflows/validate-vaft.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe et contrôles du scriptlet
        run: node scripts/check-vaft.mjs
